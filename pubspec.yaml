name: tradepath
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.2.2
  material_design_icons_flutter: ^7.0.7296
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  card_swiper: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/profile_icons/
    - assets/welcome_page_images/
    - assets/animations/networth.json
    - assets/animations/piechart.json
    - assets/edupathmap.webp
    - assets/
    - assets/images/
    - assets/animations/cloud.json
    - assets/animations/sun.json
    - assets/animations/newsun2.json
    - assets/animations/tree.json
# flutter_launcher_icons configuration should be at the root level
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/profile_icons/logo.png"
