name: tradepath
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  material_design_icons_flutter: ^7.0.7296
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/profile_icons/
    - assets/welcome_page_images/
    - assets/animations/networth.json
    - assets/animations/piechart.json

# flutter_launcher_icons configuration should be at the root level
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/profile_icons/logo.png"
